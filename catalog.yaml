# Catalog of Platform Engineering practices.
#
# Each practice has a stable ID: PFE-<AREA>-<NNN>. IDs are never reused or renumbered;
# retire a practice with `status: retired` instead of deleting it.
#
# Fields:
#   id:          stable identifier, referenced by skills and validators
#   title:       short human readable name
#   area:        one of the keys under `areas`
#   doc:         path to the documentation source (moves to docs/ with Read the Docs)
#   status:      active | draft | retired (default: active)
#   skills:      paths to skills/<name> supporting the practice
#   validators:  paths to validators/<name> checking the practice
#
# Checked by tools/check_catalog.py.

areas:
  DEF: Definitions
  PRIN: Principles
  GH: Workflows
  IMPL: Implementation
  TEST: Tests
  CI: Continuous integration
  PUB: Publication

practices:
  # Definitions
  - id: PFE-DEF-001
    title: Breaking change
    area: DEF
    doc: src/definitions/100-breaking-change.md
  - id: PFE-DEF-002
    title: Tool
    area: DEF
    doc: src/definitions/200-tool.md
  - id: PFE-DEF-003
    title: Unit tests
    area: DEF
    doc: src/definitions/300-unit-test.md
  - id: PFE-DEF-004
    title: Integration tests
    area: DEF
    doc: src/definitions/400-integration-test.md
  - id: PFE-DEF-005
    title: End to end tests
    area: DEF
    doc: src/definitions/500-end-to-end-test.md
  - id: PFE-DEF-006
    title: Smoke tests
    area: DEF
    doc: src/definitions/600-smoke-test.md

  # Principles
  - id: PFE-PRIN-001
    title: Programming languages and frameworks
    area: PRIN
    doc: src/principles/100-programming-languages-and-frameworks.md
  - id: PFE-PRIN-002
    title: Charm, Ubuntu and Python versions
    area: PRIN
    doc: src/principles/200-versions.md
  - id: PFE-PRIN-003
    title: Downloading binaries
    area: PRIN
    doc: src/principles/300-binaries.md

  # Workflows
  - id: PFE-GH-001
    title: Repository setup
    area: GH
    doc: src/github/100-repository-setup.md
  - id: PFE-GH-002
    title: PR comments and requests for changes
    area: GH
    doc: src/github/200-prs.md

  # Implementation
  - id: PFE-IMPL-001
    title: Random values
    area: IMPL
    doc: src/implementation/100-random-values.md
  - id: PFE-IMPL-002
    title: File encoding
    area: IMPL
    doc: src/implementation/200-encoding.md
  - id: PFE-IMPL-003
    title: Type hints
    area: IMPL
    doc: src/implementation/300-typing.md
  - id: PFE-IMPL-004
    title: TODOs in source code
    area: IMPL
    doc: src/implementation/400-todos.md
    skills:
      - skills/pfe-practices
    validators:
