[project]
name = "check-todos"
version = "0.1.0"
description = "Report TODO/FIXME comments left in source code (PFE-IMPL-004)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pfe-validators-common"]

[project.scripts]
check-todos = "check_todos.cli:main"

[tool.uv.sources]
pfe-validators-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/check_todos"]
