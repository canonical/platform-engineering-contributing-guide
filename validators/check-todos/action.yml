name: check-todos
description: Report TODO/FIXME comments left in source code (PFE-IMPL-004)
author: Canonical Platform Engineering

inputs:
  paths:
    description: Space-separated files or directories to check
    required: false
    default: "."
  format:
    description: Output format (github, text or json)
    required: false
    default: github
  python-version:
    description: Python version used to run the validator
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Run check-todos
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        # shellcheck disable=SC2086 # paths are intentionally word-split
        uvx --from "$ACTION_PATH" check-todos --format "$INPUT_FORMAT" $INPUT_PATHS
