[project]
name = "validator-template"
version = "0.1.0"
description = "One-line description (PFE-XXX-NNN)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pfe-validators-common"]

[project.scripts]
validator-template = "validator_template.cli:main"

[tool.uv.sources]
pfe-validators-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validator_template"]
